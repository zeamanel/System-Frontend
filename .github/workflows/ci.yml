# Checks every pull request and every push to main: lint (with the i18n
# parity check), typecheck, tests and the production build.
# Cloudflare Pages deploys main on its own; protect main with this check
# (Settings → Branches → require "CI / checks") so red code cannot merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
